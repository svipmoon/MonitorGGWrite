name: Build libHookWrite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build .so with Android NDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android NDK r26d
        run: |
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q /tmp/ndk.zip -d /opt/ndk
          echo "NDK_HOME=/opt/ndk/android-ndk-r26d" >> $GITHUB_ENV
          ls /opt/ndk/android-ndk-r26d/build/cmake/

      - name: Build arm64-v8a
        run: |
          cmake -S MonitorGG -B build/arm64-v8a             -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-21             -DANDROID_STL=c++_static             -DCMAKE_BUILD_TYPE=Release
          cmake --build build/arm64-v8a -j$(nproc)

      - name: Build armeabi-v7a
        run: |
          cmake -S MonitorGG -B build/armeabi-v7a             -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake             -DANDROID_ABI=armeabi-v7a             -DANDROID_PLATFORM=android-21             -DANDROID_STL=c++_static             -DCMAKE_BUILD_TYPE=Release
          cmake --build build/armeabi-v7a -j$(nproc)

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp build/arm64-v8a/libHookWrite.so dist/libHookWrite-arm64-v8a.so
          cp build/armeabi-v7a/libHookWrite.so dist/libHookWrite-armeabi-v7a.so
          cp MonitorGG/need/lib5.so dist/lib5.so
          cd dist
          zip -r ../libHookWrite-$(date +%Y%m%d-%H%M%S).zip .
          cd ..
          ls -lh dist/ *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libHookWrite
          path: |
            dist/*.so
            *.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: libHookWrite
          path: dist

      - name: Create tag and release
        run: |
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: libHookWrite ${{ env.TAG }}
          body: |
            Auto-built by GitHub Actions.
            - libHookWrite-arm64-v8a.so (64-bit ARM)
            - libHookWrite-armeabi-v7a.so (32-bit ARM)
            - lib5.so
          files: |
            dist/*.so
            dist/*.zip
